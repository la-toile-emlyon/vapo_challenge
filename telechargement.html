    <script>
        const sections = document.querySelectorAll("section");
        const menuLinks = document.querySelectorAll(".menu-fixe a");

        window.addEventListener("scroll", () => {
            let currentSection = "";

            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                const sectionHeight = section.offsetHeight;

                if (scrollY >= sectionTop - 150 && scrollY < sectionTop + sectionHeight) {
                    currentSection = section.getAttribute("id");
                }
            });

            menuLinks.forEach(link => {
                link.classList.remove("active");
                if (link.getAttribute("href") === `#${currentSection}`) {
                    link.classList.add("active");
                }
            });
        });
    </script>
    <script>
        const menu = document.querySelector(".menu-fixe");
        const contexte = document.getElementById("contexte");

        window.addEventListener("scroll", () => {
            const contexteTop = contexte.getBoundingClientRect().top;

            if (contexteTop <= 100) {
                menu.classList.add("visible");
            } else {
                menu.classList.remove("visible");
            }
        });
    </script>
