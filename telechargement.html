    <script>
        const sections = document.querySelectorAll("section");
        const menuLinks = document.querySelectorAll(".menu-fixe a");

        window.addEventListener("scroll", () => {
            let currentSection = "";

            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                const sectionHeight = section.offsetHeight;

                if (scrollY >= sectionTop - 150 && scrollY < sectionTop + sectionHeight) {
                    currentSection = section.getAttribute("id");
                }
            });

            menuLinks.forEach(link => {
                link.classList.remove("active");
                if (link.getAttribute("href") === `#${currentSection}`) {
                    link.classList.add("active");
                }
            });
        });
    </script>
    <script>
        const menu = document.querySelector(".menu-fixe");
        const contexte = document.getElementById("contexte");

        window.addEventListener("scroll", () => {
            const contexteTop = contexte.getBoundingClientRect().top;

            if (contexteTop <= 100) {
                menu.classList.add("visible");
            } else {
                menu.classList.remove("visible");
            }
        });
    </script>


    <script>
        let count = 999900;
        const counter = document.getElementById("counter");

        function formatNumber(num) {
            return num.toString(); // aucun espace, aucun séparateur
        }

        function renderCounter(num) {
            counter.innerHTML = "";
            const formatted = formatNumber(num);

            for (let char of formatted) {
                if (char === " ") {
                    const sep = document.createElement("div");
                    sep.className = "separator";
                    sep.textContent = " ";
                    counter.appendChild(sep);
                } else {
                    const digit = document.createElement("div");
                    digit.className = "digit";
                    digit.textContent = char;
                    counter.appendChild(digit);
                }
            }
        }

        let fireworksLaunched = false;

        function launchFireworks() {
            if (fireworksLaunched) return;
            fireworksLaunched = true;

            const container = document.getElementById("fireworks");
            const totalBursts = 8;      // nombre de vagues
            const particlesPerBurst = 45;

            for (let burst = 0; burst < totalBursts; burst++) {
                setTimeout(() => {
                    const centerX = Math.random() * window.innerWidth;
                    const centerY = Math.random() * window.innerHeight * 0.6;

                    for (let i = 0; i < particlesPerBurst; i++) {
                        const spark = document.createElement("div");
                        spark.className = "firework";

                        const angle = Math.random() * Math.PI * 2;
                        const distance = Math.random() * 400 + 100;

                        const x = Math.cos(angle) * distance + "px";
                        const y = Math.sin(angle) * distance + "px";

                        spark.style.setProperty("--x", x);
                        spark.style.setProperty("--y", y);

                        spark.style.left = centerX + "px";
                        spark.style.top = centerY + "px";

                        container.appendChild(spark);

                        setTimeout(() => spark.remove(), 1800); // correspond à la durée de l'animation
                    }
                }, burst * 500); // délai entre chaque explosion (0.5s)
            }
        }


        renderCounter(count);

        setInterval(() => {
            let increment = count < 1000000
                ? Math.floor(Math.random() * 20) + 10
                : Math.floor(Math.random() * 3) + 1;

            count += increment;
            renderCounter(count);
            if (count >= 1000000) {
                counter.classList.add("million");
                launchFireworks();
            }
        }, 1500);
    </script>
